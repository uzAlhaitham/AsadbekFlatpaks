<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1e1f22;
    color: #dbdee1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  #bar {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 6px;
    box-sizing: border-box;
  }
  .nav, .win {
    display: flex;
    align-items: center;
    gap: 4px;
    -webkit-app-region: no-drag;
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: #dbdee1;
    outline: none;
    font-family: inherit;
    -webkit-app-region: no-drag;
    box-sizing: border-box;
    transition: background 0.12s;
  }
  button svg {
    display: block;
    flex: none;
  }
  .nav button svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .win button svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  button:hover { background: #35373c; }
  button:active { background: #2b2d31; }
  button:disabled { opacity: 0.25; cursor: default; }
  button:disabled:hover { background: transparent; }
  #close:hover { background: #da373c; color: #fff; }

  #max .icon-restore { display: none; }
  #max.maximized .icon-max { display: none; }
  #max.maximized .icon-restore { display: block; }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #refresh.spinning svg {
    animation: spin-slow 1.1s linear infinite;
  }
  #refresh.spinning {
    opacity: 0.7;
    pointer-events: none;
  }

  .title {
    flex: 1;
    text-align: center;
    color: #dbdee1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 12px;
    pointer-events: none;
    line-height: 1;
  }
</style>
</head>
<body>
<div id="bar">
  <div class="nav">
    <button id="back" title="Orqaga">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="forward" title="Oldinga">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button id="refresh" title="Yangilash">
      <svg viewBox="0 0 24 24" stroke-width="2.2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>
  <div class="title" id="title">Akasha Client</div>
  <div class="win">
    <button id="min" title="Kichraytirish">
      <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6"/></svg>
    </button>
    <button id="max" title="Kattalashtirish">
      <svg class="icon-max" viewBox="0 0 12 12">
        <rect x="2" y="2" width="8" height="8"/>
      </svg>
      <svg class="icon-restore" viewBox="0 0 12 12">
        <rect x="1.5" y="1.5" width="6.5" height="6.5"/>
        <path d="M4 4 H10.5 V10.5 H4"/>
      </svg>
    </button>
    <button id="close" title="Yopish">
      <svg viewBox="0 0 12 12">
        <line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/>
        <line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/>
      </svg>
    </button>
  </div>
</div>
<script>
  const $ = function(id) { return document.getElementById(id); };
  const back = $('back'), forward = $('forward'), refresh = $('refresh');
  const min = $('min'), max = $('max'), close = $('close');
  const title = $('title');

  function bind(el, action) {
    el.addEventListener('mousedown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      action();
    });
  }

  bind(back,    function(){ window.titlebarAPI.back(); });
  bind(forward, function(){ window.titlebarAPI.forward(); });
  bind(min,     function(){ window.titlebarAPI.minimize(); });
  bind(max,     function(){ window.titlebarAPI.maximize(); });
  bind(close,   function(){ window.titlebarAPI.close(); });

  refresh.addEventListener('mousedown', function(e) {
    e.preventDefault();
    e.stopPropagation();
    window.titlebarAPI.refresh();
  });

  if (window.titlebarAPI && window.titlebarAPI.onNavState) {
    window.titlebarAPI.onNavState(function(state) {
      back.disabled = !state.canGoBack;
      forward.disabled = !state.canGoForward;
      if (state.title) title.textContent = state.title;

      if (state.isMaximized) {
        max.classList.add('maximized');
        max.title = 'Tiklash';
      } else {
        max.classList.remove('maximized');
        max.title = 'Kattalashtirish';
      }
    });
  }

  if (window.titlebarAPI && window.titlebarAPI.onLoadingState) {
    window.titlebarAPI.onLoadingState(function(isLoading) {
      if (isLoading) refresh.classList.add('spinning');
      else refresh.classList.remove('spinning');
    });
  }

  document.addEventListener('dblclick', function(e) {
    if (e.target.closest('button')) return;
    window.titlebarAPI.maximize();
  });
</script>
</body>
</html>
