name: Build Akasha System Flatpak

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/akasha-system/**'
      - '.github/workflows/build-akasha.yml'
  workflow_dispatch:

jobs:
  build-akasha:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          dnf install -y nodejs npm || apt-get update && apt-get install -y nodejs npm

      - name: NPM install (Electron)
        working-directory: apps/akasha-system
        run: |
          npm install --ignore-scripts=false

      - name: Verify electron binary
        working-directory: apps/akasha-system
        run: |
          ls -la node_modules/electron/dist/electron || echo "Electron binary yo'q"

      - name: Build Flatpak bundle
        working-directory: apps/akasha-system
        run: |
          flatpak-builder --user --repo=repo --force-clean build-dir asadbek.akasha.cv.yaml
          flatpak build-bundle repo asadbek.akasha.cv-x86_64.flatpak asadbek.akasha.cv
          ls -lh asadbek.akasha.cv-x86_64.flatpak

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bundles-v1
          name: Flatpak Bundles
          files: apps/akasha-system/asadbek.akasha.cv-x86_64.flatpak
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
