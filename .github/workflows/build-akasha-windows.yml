name: Build Akasha System Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/akasha-system/**'
      - '.github/workflows/build-akasha-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/akasha-system
        run: npm install

      - name: Build Windows EXE
        working-directory: apps/akasha-system
        run: npm run dist:win

      - name: List output
        working-directory: apps/akasha-system
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bundles-v1
          name: Application Bundles
          files: |
            apps/akasha-system/dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
