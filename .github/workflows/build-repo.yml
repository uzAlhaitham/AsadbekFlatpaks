name: Build Flatpak Repository

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**/*.flatpak'
      - 'apps/**/app-info.yml'
      - '.github/workflows/build-repo.yml'
  workflow_dispatch:

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import GPG key and preset passphrase
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf << 'CONF'
          use-agent
          pinentry-mode loopback
          no-tty
          CONF
          cat > ~/.gnupg/gpg-agent.conf << 'CONF'
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 34560000
          max-cache-ttl 34560000
          CONF
          chmod 600 ~/.gnupg/gpg.conf ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          sleep 1
          gpg-connect-agent /bye || true
          sleep 1
          echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          KEYGRIPS=$(gpg --with-keygrip --list-secret-keys "$GPG_FINGERPRINT" | grep "Keygrip" | awk '{print $3}')
          PRESET=$(find /usr/lib -name gpg-preset-passphrase 2>/dev/null | head -n1)
          for KG in $KEYGRIPS; do
            echo "$GPG_PASSPHRASE" | "$PRESET" --preset "$KG" || true
          done

      - name: Build Flatpak repository
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          mkdir -p public
          mkdir -p repo
          ostree init --repo=repo --mode=archive-z2

          shopt -s nullglob globstar
          FOUND=0
          for BUNDLE in apps/**/bundle/*.flatpak; do
            echo "=== Importing: $BUNDLE ==="
            flatpak build-import-bundle \
                --gpg-sign="$GPG_FINGERPRINT" \
                --gpg-homedir="$HOME/.gnupg" \
                repo "$BUNDLE"
            FOUND=$((FOUND + 1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No .flatpak bundles found in apps/*/bundle/"
            exit 1
          fi

          echo "Imported $FOUND bundles"

          flatpak build-update-repo \
              --gpg-sign="$GPG_FINGERPRINT" \
              --gpg-homedir="$HOME/.gnupg" \
              repo

          echo "=== Applications in repo ==="
          ostree --repo=repo refs | grep "^app/" || true

          mv repo public/repo
          cp asadbekflatpaks.flatpakrepo public/
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><title>AsadbekFlatpaks</title></head>
          <body><h1>AsadbekFlatpaks</h1>
          <p>Personal Flatpak repository</p>
          </body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-releases:
    runs-on: ubuntu-latest
    needs: build-repo
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create releases for new apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          for INFO in apps/*/app-info.yml; do
            APP_DIR=$(dirname "$INFO")
            NAME=$(grep '^name:' "$INFO" | sed 's/name: *//')
            VERSION=$(grep '^version:' "$INFO" | sed 's/version: *//')
            TAG=$(grep '^release_tag:' "$INFO" | sed 's/release_tag: *//')
            BUNDLE=$(ls "$APP_DIR"/bundle/*.flatpak 2>/dev/null | head -1)

            if [ -z "$BUNDLE" ]; then
              echo "No bundle for $NAME, skipping"
              continue
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            echo "Creating release $TAG for $NAME $VERSION"
            gh release create "$TAG" "$BUNDLE" \
              --title "$NAME v$VERSION (Flatpak)" \
              --notes "Flatpak bundle for $NAME $VERSION.

Install: flatpak install --user \$(basename \"$BUNDLE\")

Or add the repository:
flatpak remote-add --if-not-exists asadbekflatpaks https://uzAlhaitham.github.io/AsadbekFlatpaks/asadbekflatpaks.flatpakrepo
flatpak install asadbekflatpaks $NAME"
          done
